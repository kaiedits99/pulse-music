services:
  - type: web
    name: pulse-music
    runtime: node
    plan: free
    # The client build needs the root lockfile *and* client/'s, so `npm ci` runs in
    # both. The server itself starts from the repo root (see package.json > start).
    buildCommand: "npm ci && cd client && npm ci && npm run build"
    startCommand: "npm start"
    # Render pings this before routing traffic, so a deploy only goes live once the
    # process is actually serving. It intentionally does no DB work, so boot-time
    # maintenance can never make a healthy instance look dead.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false   # optional: public Google OAuth client ID; set in Render dashboard to enable "Sign in with Google"
    # NOTE — free-tier storage: Pulse starts empty and its catalog is made only of
    # what people upload. Render's free instances have an **ephemeral filesystem**,
    # so data/pulse.db and every upload (data/uploads) are wiped whenever the
    # instance restarts, redeploys or spins down after being idle — the app is then
    # blank again until someone uploads.
    #
    # To keep the catalog, attach a Render Disk (paid plans only) and uncomment the
    # block below — it mounts over the app's own data/ directory:
    #
    # disk:
    #   name: pulse-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
