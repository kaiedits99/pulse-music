services:
  - type: web
    name: pulse-music
    runtime: node
    plan: free
    # The client build needs the root lockfile *and* client/'s, so `npm ci` runs in
    # both. The server itself starts from the repo root (see package.json > start).
    buildCommand: "npm ci && cd client && npm ci && npm run build"
    # Restores the database from the bucket if this machine doesn't have one, then runs the server
    # under Litestream, which keeps copying changes back. With no bucket settings it simply starts
    # the server, exactly like `npm start`. See DEPLOY.md.
    startCommand: "npm run start:render"
    # Render pings this before routing traffic, so a deploy only goes live once the
    # process is actually serving. It intentionally does no DB work, so boot-time
    # maintenance can never make a healthy instance look dead.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # The Node.js version is pinned on purpose. `better-sqlite3` is a native module:
      # it runs from a prebuilt binary for known Node versions and otherwise tries to
      # compile itself from source, which fails on Node versions newer than the package
      # supports (that is what broke the 2026-10-02 deploy on Node 26). The pin lives in
      # three places that must agree — here, `engines.node` and `.node-version` — and
      # server/test/node-version.test.js fails the suite if they ever drift apart.
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false   # optional: public Google OAuth client ID; set in Render dashboard to enable "Sign in with Google"
      # Where uploads and the database copy are kept. Render asks for these when the Blueprint is
      # created. Set all four (a Cloudflare R2 bucket is the free choice; DEPLOY.md has the steps).
      - key: S3_ENDPOINT
        sync: false   # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Free instances fall asleep after ~15 minutes without a visitor. With this on, the app requests
      # its own /api/health every 5 minutes, but only during KEEP_AWAKE_HOURS below.
      - key: KEEP_AWAKE
        value: "true"
      # Render's free plan gives the whole workspace 750 instance hours a month and a month is only
      # about 730 hours long. An app kept awake around the clock therefore spends the entire allowance
      # by itself, and Render suspends the service as soon as it is gone — the site disappears until
      # the 1st of the next month. "6-24" keeps it awake from 6am to midnight and lets it sleep for the
      # quiet six hours, which puts the month at roughly 550 hours and makes running out impossible.
      # Anyone visiting during the sleeping hours simply waits a few seconds for it to wake. Set
      # "0-24" to be awake around the clock and accept that the allowance runs out before month end.
      - key: KEEP_AWAKE_HOURS
        value: "6-24"
      # The timezone those hours are read in (IANA name). Without it the times would be in the server's
      # clock, which is UTC on Render. Set this to your own timezone in the dashboard, or in this file
      # before you create the Blueprint.
      - key: PULSE_TIMEZONE
        value: Africa/Lagos
    # NOTE — free-tier storage: Render's free instances have an **ephemeral filesystem**, wiped on every
    # restart, redeploy or sleep. Pulse therefore keeps its uploads in the bucket above and its database
    # in the same bucket through Litestream, so nothing is lost. Without the S3_* settings, the database
    # and every upload would vanish with each restart (the app logs a warning).
    #
    # Prefer to keep everything on the server instead? Use a paid instance with a Render Disk: uncomment
    # the block below, set startCommand back to "npm start", and leave the S3_* settings empty. The disk
    # mounts over the app's own data/ directory:
    #
    # disk:
    #   name: pulse-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
