name: Build Windows app

# Produces Pulse for Windows: an installer (.exe) and a portable .exe that runs without installing.
# The app is the same Pulse as the website — same catalog, accounts and messages — so the one build
# input that matters is the website address it opens.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with the .exe files (a permanent download link)'
        type: boolean
        default: false

# The build only reads the repository; the release step writes a Release and its assets.
permissions:
  contents: write

jobs:
  build:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The address the app opens on first launch. Set it once under
      # Settings → Secrets and variables → Actions → Variables as PULSE_APP_URL
      # (VITE_API_URL is accepted too, so one variable configures both apps).
      # Without it, the app asks for the address the first time it runs.
      - name: Bake in the website address
        shell: bash
        env:
          WEBSITE: ${{ vars.PULSE_APP_URL || vars.VITE_API_URL }}
        run: |
          if [ -n "$WEBSITE" ]; then
            node -e "const fs=require('fs');fs.writeFileSync('desktop/config.json', JSON.stringify({url: process.argv[1]}, null, 2))" "$WEBSITE"
            echo "Building with website: $WEBSITE"
          else
            echo "No PULSE_APP_URL/VITE_API_URL variable set — the app will ask for the address on first launch."
          fi

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Test the address handling
        working-directory: desktop
        run: npm test

      # Unsigned is expected here: signing needs a paid certificate. Windows SmartScreen will warn
      # the first time the .exe runs ("More info → Run anyway").
      - name: Build the installer and portable app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: List what was built
        working-directory: desktop
        shell: bash
        run: ls -lh release/*.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: pulse-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14

      # An Actions artifact needs a GitHub login and expires after 14 days. A Release is a plain,
      # public download link that works for anyone: run this workflow with "publish_release"
      # ticked, or push a tag starting with v.
      - name: Publish a GitHub Release
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_release) || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="desktop-v$(node -p "require('./desktop/package.json').version")"
          fi
          VERSION="${TAG#desktop-v}"
          VERSION="${VERSION#v}"
          echo "Publishing $TAG"

          cat > release-notes.md <<'NOTES'
          Pulse for Windows — the same catalog, accounts and messages as the Pulse website.

          **Windows**
          1. `Pulse-Setup-VERSION.exe` installs Pulse (desktop and Start Menu shortcuts).
             `Pulse-Portable-VERSION.exe` runs without installing.
          2. Windows may warn that the app is unrecognised because the build is unsigned:
             choose **More info → Run anyway**.
          3. On first launch, enter the address of your Pulse website (for example
             `https://pulse-music.onrender.com`) and press **Connect**. The app remembers it.

          **Android**
          `Pulse-VERSION-android.apk` (attached by the Android build) installs the phone app.
          Allow "install unknown apps" for your file manager if Android asks.

          Building it yourself: see DESKTOP-BUILD.md and ANDROID-BUILD.md in the repository.
          NOTES
          sed -i "s/VERSION/$VERSION/g" release-notes.md

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Pulse $VERSION" --notes-file release-notes.md
          gh release upload "$TAG" desktop/release/*.exe --clobber
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
