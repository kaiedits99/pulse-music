# Keeps Pulse's SQLite database safe on hosts whose disk is wiped on every restart (Render's free plan).
# Litestream copies every change to the same bucket that holds the uploads, and a fresh instance restores
# the database from there when it boots. scripts/start-with-litestream.sh runs it; DEPLOY.md explains
# the setup. ${...} values come from the environment and are all the settings you already gave Pulse.
dbs:
  - path: ${PULSE_DB_PATH}
    replicas:
      - type: s3
        bucket: ${S3_BUCKET}
        path: litestream/pulse          # no leading slash; kept apart from the uploads/ folder
        endpoint: ${S3_ENDPOINT}
        region: ${S3_REGION}
        access-key-id: ${S3_ACCESS_KEY_ID}
        secret-access-key: ${S3_SECRET_ACCESS_KEY}
        force-path-style: true
        # How often changes are pushed (5s unless PULSE_DB_SYNC_SECONDS says otherwise). Litestream's own
        # default is every second, and each push is one billable write to the bucket. Five seconds keeps
        # this inside R2's free allowance however busy the site gets: at most about 520,000 writes a month
        # against 1,000,000 free, and far fewer in practice because nothing is pushed while nobody is
        # changing anything. The most a crash can lose is the last few seconds of changes.
        sync-interval: ${PULSE_DB_SYNC_INTERVAL}

  # Messages: replicated too, because on a host with a temporary disk an unclean restart would
  # otherwise lose every open conversation. The difference from the catalogue is retention — a
  # replica keeps a history of older page contents, so "deleted" has to mean deleted here as well.
  # Six hours is long enough to survive a crash or a bad deploy, and far shorter than the 24 hours
  # a conversation lives in the first place.
  - path: ${PULSE_CHAT_DB_PATH}
    replicas:
      - type: s3
        bucket: ${S3_BUCKET}
        path: litestream/chat
        endpoint: ${S3_ENDPOINT}
        region: ${S3_REGION}
        access-key-id: ${S3_ACCESS_KEY_ID}
        secret-access-key: ${S3_SECRET_ACCESS_KEY}
        force-path-style: true
        sync-interval: ${PULSE_DB_SYNC_INTERVAL}
        retention: 6h
