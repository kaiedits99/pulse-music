name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with the APK (a permanent download link)'
        type: boolean
        default: false

# Building only reads the repository; publishing a Release writes an asset.
permissions:
  contents: write

# Two pushes to the same branch must not publish the same release tag at once.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      # The same variable points the app at the site. With it set, the app opens the live
      # website (so web fixes arrive with every deploy instead of needing a new APK); without it,
      # the app bundles its own copy and asks for an address on first launch.
      - name: Choose how the app loads Pulse
        working-directory: client
        env:
          PULSE_APP_URL: ${{ vars.PULSE_APP_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: node scripts/capacitor-config.mjs

      - name: Build web app
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run build

      - name: Generate Capacitor Android project
        working-directory: client
        run: npx cap add android

      # Android refuses to install an update whose versionCode is not greater than the installed
      # one, so every build carries the client version as both its name and its code. Without this
      # the app was stuck at "1.0.5 (1)" and a fixed APK could not be installed over an old one.
      - name: Stamp the app version
        working-directory: client
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const [major = 0, minor = 0, patch = 0] = String(pkg.version).split('.').map(Number);
          const versionCode = major * 10000 + minor * 100 + patch;
          const gradlePath = 'android/app/build.gradle';
          let gradle = fs.readFileSync(gradlePath, 'utf8');
          if (!/versionCode\s+\d+/.test(gradle) || !/versionName\s+"[^"]*"/.test(gradle)) {
            throw new Error('version fields not found in ' + gradlePath);
          }
          gradle = gradle
            .replace(/versionCode\s+\d+/, `versionCode ${versionCode}`)
            .replace(/versionName\s+"[^"]*"/, `versionName "${pkg.version}"`);
          fs.writeFileSync(gradlePath, gradle);
          console.log(`[android] versionName ${pkg.version} (versionCode ${versionCode})`);
          NODE

      - name: Build debug APK
        working-directory: client/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: pulse-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # An Actions artifact needs a GitHub login and expires after 14 days, so the download link
      # people actually use is a Release. A release is published for every build on the default
      # branch and for v* tags; the tag is the client version, so the app's own update check sees a
      # newer version exactly when a newer APK exists. (It used to be published only when a tag was
      # pushed, which left a month-old APK as the newest download while main had moved on.)
      - name: Publish a GitHub Release
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish_release)
          || startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./client/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$VERSION"
          fi
          VERSION="${VERSION#v}"
          APK="client/android/app/build/outputs/apk/debug/app-debug.apk"
          ASSET="Pulse-$VERSION-android.apk"
          cp "$APK" "$ASSET"

          # If the Windows workflow got here first the release already exists — just add the APK.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Pulse $VERSION" \
              --notes "Install Pulse on your phone with \`$ASSET\` (Android 6.0 or newer). An installed copy keeps your account and downloads; tap the APK to update. Windows builds are attached to the same release." \
              || true
          fi
          gh release upload "$TAG" "$ASSET" --clobber
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
