services:
  - type: web
    name: pulse-music
    runtime: node
    plan: free
    buildCommand: "npm ci && cd client && npm ci && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false   # optional: public Google OAuth client ID; set in Render dashboard to enable "Sign in with Google"
