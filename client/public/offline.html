<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08080a" />
  <title>Pulse — can’t reach the site</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px;
      background: radial-gradient(900px 620px at 50% -10%, #1d1430 0%, #0b0a10 55%, #08080a 100%);
      color: #eceaf5; font: 15px/1.6 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
      text-align: center;
    }
    main { max-width: 340px; }
    .glyph {
      width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 19px; display: grid; place-items: center;
      background: linear-gradient(135deg, #a855f7, #6d28d9); box-shadow: 0 14px 40px rgba(124, 58, 237, .35);
    }
    h1 { font-size: 21px; line-height: 1.3; margin: 0 0 10px; }
    p { margin: 0 0 22px; color: #a9a3bf; font-size: 14px; }
    button {
      font: inherit; font-weight: 700; color: #fff; cursor: pointer;
      padding: 13px 26px; border: 0; border-radius: 999px;
      background: linear-gradient(135deg, #a855f7, #7c3aed 60%, #6d28d9);
      box-shadow: 0 10px 26px rgba(124, 58, 237, .3);
    }
    button:active { transform: translateY(1px); }
    .hint { margin-top: 22px; font-size: 12px; color: #7f7a95; }
  </style>
</head>
<body>
  <main>
    <div class="glyph" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 512 512" fill="none">
        <g stroke="#fff" stroke-width="34" stroke-linecap="round">
          <path d="M131 256h13" /><path d="M186 208v96" /><path d="M254 152v208" />
          <path d="M322 196v120" /><path d="M390 232v48" />
        </g>
      </svg>
    </div>
    <h1>Can’t reach Pulse right now</h1>
    <p>Check your connection — or give the site a moment if it was asleep — then try again.</p>
    <button id="retry" type="button">Try again</button>
    <p class="hint">Anything you downloaded for offline listening is still on this device.</p>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', () => {
      // In the app this reload is what re-attempts the remote URL; in a browser it is a normal
      // refresh of whatever page was open.
      window.location.reload();
    });
  </script>
</body>
</html>
